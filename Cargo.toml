[package]
name = "gitkrill"
version = "0.3.0"
edition = "2024"
description = "A fast, native Git client with a commit graph, written in Rust"
license = "MIT"
repository = "https://github.com/moulmandev/GitKrill"
readme = "README.md"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
# eframe and egui-phosphor must agree on the egui version: phosphor 0.14 is
# built against egui 0.36, so bump the two together.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui-phosphor = "0.14.0"
# Reading and writing files in the encoding a repository is set to
# (Preferences > Encoding): Windows-1252, Shift_JIS, GBK and the like.
encoding_rs = "0.8.44"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
notify = "8"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Already in the build through egui (it parses fonts with it); used directly
# to check a font file before egui loads it (Preferences > Editor).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Syntax colours. Only the parser and the pure-Rust regex engine: the
# grammars come from two-face, and the few of our own are read from YAML.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "yaml-load", "dump-load"] }
# Grammars for syntax colours: syntect's own set plus bat's (TypeScript and
# TSX, Kotlin, Swift, Dart, Dockerfile, TOML, Vue, Zig and many more), in a
# dump built for the regex engine above. Loaded on the highlighter's thread
# the first time a diff is coloured.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# SVG changes shown as pictures in the image preview. Text is drawn with
# the fonts built into the app (no system font scan); pictures embedded in
# an SVG are left out.
resvg = { version = "0.49", default-features = false, features = ["text"] }
ureq = "3.5.1"

# Replacing the running executable when a portable copy updates itself
# (Windows keeps a running .exe locked; this works around that).
self-replace = "1.5"

[build-dependencies]
# The executable's icon and version details on Windows (see build.rs).
winresource = "0.1"

# Linux needs a window-system backend chosen explicitly because eframe's
# default features are off; with both, the app runs on X11 and Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }

# Keep our own code quick to rebuild, but run dependencies (text layout,
# tessellation, libgit2) optimised so debug builds stay usable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
